name: Android preview
on:
  push:
    branches: [main]
    paths-ignore: ['apk/**', '**.md', 'docs/screenshots/**', 'docs/ci/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            unzip -q /tmp/android-tools.zip -d /tmp/android-tools
            mv /tmp/android-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools' 2>&1 | tee sdk-setup.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, unit tests and lint
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Prepare preview metadata
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/PapazolaXBoboiboy-0.1.0-preview.apk
          cd preview
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source: %s\nBuild: %s\nDebug-signed PREVIEW. Not stable. No physical-device validation yet.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.run_number }}
          path: preview/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
            sdk-setup.log
      - name: Publish failure diagnostics
        if: failure() && github.event_name != 'pull_request'
        run: |
          mkdir -p docs/ci
          { echo "Source: $GITHUB_SHA / run: $GITHUB_RUN_ID"; tail -n 140 sdk-setup.log build.log 2>/dev/null || true; } > docs/ci/latest-build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci/latest-build.txt
          git diff --cached --quiet || { git commit -m 'ci: record preview build diagnostics [skip ci]'; git push; }
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          disable-animations: false
          script: |
            adb shell wm size
            adb shell wm density
            bash ci/run-emulator-tests.sh
      - name: Collect UI screenshot
        if: always()
        run: |
          mkdir -p screenshots
          find screenshots -maxdepth 2 -type f -print || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results
          path: |
            screenshots/
            smoke.log
            runtime.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - uses: actions/download-artifact@v5
        with:
          name: android-preview-${{ github.run_number }}
          path: preview
      - name: Publish tested preview (not stable)
        if: success() && github.event_name != 'pull_request'
        run: |
          mkdir -p apk/preview docs/screenshots
          cp preview/* apk/preview/
          cp screenshots/*.png docs/screenshots/
          printf '\nAPI 28 Android TV emulator smoke checks passed. Physical TV validation pending.\n' >> apk/preview/BUILD.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/preview docs/screenshots
          git diff --cached --quiet || { git commit -m 'build: publish emulator-tested preview APK [skip ci]'; git push; }
      - name: Publish smoke failure diagnostics
        if: failure() && github.event_name != 'pull_request'
        run: |
          mkdir -p docs/ci
          { echo "Source: $GITHUB_SHA / run: $GITHUB_RUN_ID"; tail -n 160 smoke.log runtime.log 2>/dev/null || true; find app/build/outputs/androidTest-results -name '*.xml' -exec tail -n 50 {} \; 2>/dev/null || true; } > docs/ci/latest-smoke.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if compgen -G 'screenshots/*.png' > /dev/null; then
            mkdir -p docs/screenshots
            cp screenshots/*.png docs/screenshots/
            git add docs/screenshots
          fi
          git add docs/ci/latest-smoke.txt
          git diff --cached --quiet || { git commit -m 'ci: record emulator diagnostics [skip ci]'; git push; }
