name: Android preview
on:
  push:
    branches: [main]
    paths-ignore: ['apk/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, unit tests and lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Prepare preview metadata
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/PapazolaXBoboiboy-0.1.0-preview.apk
          cd preview
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source: %s\nBuild: %s\nDebug-signed PREVIEW. Not stable. No device validation yet.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.run_number }}
          path: preview/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          disable-animations: false
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Collect UI screenshot
        if: always()
        run: |
          mkdir -p screenshots
          adb pull /sdcard/Android/data/my.papazola.tv/files/home-preview.png screenshots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results
          path: |
            screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
