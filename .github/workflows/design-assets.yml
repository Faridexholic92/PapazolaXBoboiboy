name: Publish design video asset
on:
  push:
    branches: ['design/cinematic-v2']
    paths:
      - 'docs/design/v2/assets/*.base64'
      - '.github/workflows/design-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Decode versioned video source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          root = Path('docs/design/v2/assets')
          for source in root.glob('*.mp4.base64'):
              target = source.with_suffix('')
              data = base64.b64decode(''.join(source.read_text().split()), validate=True)
              target.write_bytes(data)
              target.with_suffix('.mp4.sha256').write_text(hashlib.sha256(data).hexdigest() + '  ' + target.name + '\n')
          PY
      - name: Commit video and checksum on the design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/v2/assets/*.mp4 docs/design/v2/assets/*.sha256
          git diff --cached --quiet || { git commit -m 'design: publish atmospheric MP4 preview and checksum [skip ci]'; git push; }
